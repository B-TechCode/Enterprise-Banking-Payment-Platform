server:
  port: 8088

spring:
  application:
    name: biller-service
  datasource:
    url: jdbc:postgresql://localhost:5432/billerdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-wgk04dj5v68sbhre.us.auth0.com/

auth0:
  audience: https://mockbank/api

logging:
  level:
    org.springframework.security.oauth2: DEBUG
    org.springframework.security: DEBUG
