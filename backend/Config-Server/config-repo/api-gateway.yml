server:
  port: 8080

spring:
  application:
    name: api-gateway

  # NOTE: spring.config.import must NOT appear in a file served BY Config
  # Server. The native loader builds a child Environment from these files and
  # processes the import, causing Config Server to call itself recursively
  # until its Tomcat thread pool is exhausted. The import belongs only in the
  # client's own src/main/resources/application.yml.

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-vkxlfm4oy207h5bq.us.auth0.com/

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: lb://auth-user
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<segment>.*), /api/v1/${segment}

        - id: customer-service
          uri: lb://customer-service
          predicates:
            - Path=/customers/**
          filters:
            - RewritePath=/customers/(?<segment>.*), /api/v1/${segment}

        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/accounts/**
          filters:
            - RewritePath=/accounts/(?<segment>.*), /api/v1/${segment}

        - id: biller-service
          uri: lb://biller-service
          predicates:
            - Path=/billers/**
          filters:
            - RewritePath=/billers/(?<segment>.*), /api/v1/${segment}

        - id: payment-orchestrator
          uri: lb://payment-orchestrator
          predicates:
            - Path=/payments/**
          filters:
            - RewritePath=/payments/(?<segment>.*), /api/v1/${segment}

        - id: billpay-worker-service
          uri: lb://billpay-worker-service
          predicates:
            - Path=/workers/**
          filters:
            - RewritePath=/workers/(?<segment>.*), /api/mock/central1/${segment}

        - id: settlement-service
          uri: lb://settlement-service
          predicates:
            - Path=/settlements/**
          filters:
            - RewritePath=/settlements/(?<segment>.*), /api/v1/${segment}

        # =========================
        # OpenAPI routes
        # =========================

        - id: auth-openapi
          uri: lb://auth-user
          predicates:
            - Path=/v3/api-docs/auth
          filters:
            - RewritePath=/v3/api-docs/auth, /v3/api-docs

        - id: customer-openapi
          uri: lb://customer-service
          predicates:
            - Path=/v3/api-docs/customers
          filters:
            - RewritePath=/v3/api-docs/customers, /v3/api-docs

        - id: account-openapi
          uri: lb://account-service
          predicates:
            - Path=/v3/api-docs/accounts
          filters:
            - RewritePath=/v3/api-docs/accounts, /v3/api-docs

        - id: biller-openapi
          uri: lb://biller-service
          predicates:
            - Path=/v3/api-docs/billers
          filters:
            - RewritePath=/v3/api-docs/billers, /v3/api-docs

        - id: payment-openapi
          uri: lb://payment-orchestrator
          predicates:
            - Path=/v3/api-docs/payments
          filters:
            - RewritePath=/v3/api-docs/payments, /v3/api-docs

        - id: worker-openapi
          uri: lb://billpay-worker-service
          predicates:
            - Path=/v3/api-docs/workers
          filters:
            - RewritePath=/v3/api-docs/workers, /v3/api-docs

        - id: settlement-openapi
          uri: lb://settlement-service
          predicates:
            - Path=/v3/api-docs/settlements
          filters:
            - RewritePath=/v3/api-docs/settlements, /v3/api-docs

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth

      - name: Customer Service
        url: /v3/api-docs/customers

      - name: Account Service
        url: /v3/api-docs/accounts

      - name: Biller Service
        url: /v3/api-docs/billers

      - name: Payment Orchestrator
        url: /v3/api-docs/payments

      - name: Bill Pay Worker Service
        url: /v3/api-docs/workers

      - name: Settlement Service
        url: /v3/api-docs/settlements

gateway:
  security:
    jwt:
      secret: ${JWT_SECRET:banking-gateway-secret}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.http.server.reactive: INFO
    com.digitalbank.apigateway: INFO