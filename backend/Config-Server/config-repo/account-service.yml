server:
  port: 8084

spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/accountsdb?options=-c%20TimeZone=UTC
    username: ${DIGITALBANK_DB_USER:postgres}
    password: ${DIGITALBANK_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-vkxlfm4oy207h5bq.us.auth0.com/}

customer:
  service:
    url: http://customer-service:8083

auth0:
  audience: https://mockbank/api

logging:
  level:
    org.springframework.security.oauth2.jwt: TRACE
    org.springframework.security.oauth2.server.resource.authentication: TRACE
    org.springframework.security: INFO
