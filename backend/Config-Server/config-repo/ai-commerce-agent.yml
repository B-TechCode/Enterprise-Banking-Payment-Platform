server:
  port: 8095

spring:
  application:
    name: ai-commerce-agent

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/aicommercedb?options=-c%20TimeZone=UTC
    username: ${DIGITALBANK_DB_USER:postgres}
    password: ${DIGITALBANK_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-vkxlfm4oy207h5bq.us.auth0.com/}

auth0:
  audience: ${AUTH0_AUDIENCE:https://mockbank/api}

# Downstream services are reached through their public REST APIs only.
# The agent has no datasource pointing at another service.
account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8084}

biller:
  service:
    url: ${BILLER_SERVICE_URL:http://localhost:8088}

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8086}

agent:
  # The Gemini API key comes from the GEMINI_API_KEY environment variable and is
  # never stored in configuration. It is read directly from the environment at
  # startup rather than bound as a property, so it stays out of the Spring
  # Environment and cannot be served by an actuator endpoint.
  model: gemini-3.5-flash
  base-url: https://generativelanguage.googleapis.com/v1beta
  # Bound on tool calls within a single turn, so a model that keeps calling the
  # same tool cannot hold a request open.
  max-tool-iterations: 5
  request-timeout-seconds: 30
  temperature: 0.2
  # Largest amount the agent may stage for confirmation. Above this it refuses
  # rather than proposing.
  max-proposal-amount: 1000.00
  # How long a staged proposal stays confirmable.
  proposal-ttl-seconds: 300

logging:
  level:
    com.digitalbank.aicommerce: DEBUG
    org.springframework.security: INFO
