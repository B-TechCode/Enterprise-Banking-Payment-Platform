server:
  port: 8095

spring:
  application:
    name: ai-commerce-agent

  datasource:
    url: jdbc:postgresql://localhost:5433/aicommercedb?options=-c%20TimeZone=UTC
    username: ${DIGITALBANK_DB_USER:postgres}
    password: ${DIGITALBANK_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-vkxlfm4oy207h5bq.us.auth0.com/

auth0:
  audience: ${AUTH0_AUDIENCE:https://mockbank/api}

# Downstream services are reached through their public REST APIs only.
# The agent has no datasource pointing at another service.
account:
  service:
    url: http://localhost:8084

biller:
  service:
    url: http://localhost:8088

payment:
  service:
    url: http://localhost:8086

agent:
  # Anthropic API key comes from the ANTHROPIC_API_KEY environment variable and
  # is never stored in configuration.
  model: claude-opus-5
  effort: medium
  # Largest amount the agent may stage for confirmation. Above this it refuses
  # rather than proposing.
  max-proposal-amount: 1000.00
  # How long a staged proposal stays confirmable.
  proposal-ttl-seconds: 300

logging:
  level:
    com.digitalbank.aicommerce: DEBUG
    org.springframework.security: INFO
