server:
  port: 8084

spring:
  application:
    name: account-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-vkxlfm4oy207h5bq.us.auth0.com/

  datasource:
    url: "jdbc:postgresql://127.0.0.1:5432/accountsdb?options=-c%20TimeZone=UTC"
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.security: DEBUG

account:
  service:
    url: http://localhost:8084

auth0:
  audience: https://mockbank/api