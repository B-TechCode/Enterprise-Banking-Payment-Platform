server:
  port: 8084

spring:
  application:
    name: account-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-vkxlfm4oy207h5bq.us.auth0.com/}

  # The datasource lives in config-repo/account-service.yml, alongside every
  # other service's, so its host can be supplied by the environment. Keeping a
  # copy here would shadow it with a hardcoded 127.0.0.1, which inside a
  # container points at the container itself.

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.security: DEBUG

account:
  service:
    url: http://localhost:8084

auth0:
  audience: https://mockbank/api