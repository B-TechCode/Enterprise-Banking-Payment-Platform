server:
  port: 8094

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://dev-vkxlfm4oy207h5bq.us.auth0.com/
  application:
    name: auth-user


logging:
  level:
    root: INFO
    com.authuser: DEBUG
    org.springframework.security: DEBUG
    

    
    
consent:
  service:
    url: http://localhost:8096/api/v1
    
    
auth0:
  # Tenant and Management API credentials are supplied by the environment so no
  # tenant identity or credential is stored in version control.
  #
  # Required only for the Auth0 Management API calls made by
  # ManagementTokenService / Auth0UserService (POST /api/v1/iam/users).
  # Defaults are intentionally empty: the service starts without them, and the
  # Management API call fails at invocation time rather than blocking startup.
  #
  #   AUTH0_DOMAIN            e.g. https://<tenant>.us.auth0.com
  #   AUTH0_MGMT_CLIENT_ID    Management API M2M application client id
  #   AUTH0_MGMT_CLIENT_SECRET  Management API M2M application client secret
  #   AUTH0_MGMT_AUDIENCE     e.g. https://<tenant>.us.auth0.com/api/v2/
  domain: ${AUTH0_DOMAIN:}
  audience: ${AUTH0_AUDIENCE:https://mockbank/api}
  mgmt:
    client-id: ${AUTH0_MGMT_CLIENT_ID:}
    client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
    audience: ${AUTH0_MGMT_AUDIENCE:}