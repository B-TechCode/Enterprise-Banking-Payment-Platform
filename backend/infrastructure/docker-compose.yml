name: digital-banking-platform

# Whole platform in one command, run from this directory:
#
#   docker compose up --build             core infra + all 11 services
#   docker compose --profile observability up --build
#                                         ...plus Zipkin, Prometheus, Grafana
#
# Settings and secrets come from .env next to this file (copy .env.example) and
# from the shell. GEMINI_API_KEY is read from the shell, so a user-level
# environment variable works without being written to any file.
#
# Networking: every container is on banking-network and reaches the others by
# service name. Services register in Eureka with their container IP
# (prefer-ip-address: true), which is routable on this network, so lb:// routes
# through the gateway resolve correctly. Keep every service on this one
# network: a container attached to two networks can register an IP the others
# cannot reach.

# ---------------------------------------------------------------------------
# Shared settings for the Spring services
# ---------------------------------------------------------------------------

x-spring-env: &spring-env
  # Config Server by name. Fail-fast turns an unreachable Config Server into a
  # crash and restart. Without it, the services' optional: import lets them
  # boot with no configuration at all: wrong port, no datasource.
  CONFIG_SERVER_URL: http://config-server:8888
  SPRING_CLOUD_CONFIG_FAIL_FAST: "true"

  EUREKA_URL: http://service-registry:8761/eureka/

  # 5432 is Postgres's port on the network. 5433 is only the host mapping.
  DB_HOST: postgres
  DB_PORT: "5432"
  DIGITALBANK_DB_USER: ${DIGITALBANK_DB_USER:?set DIGITALBANK_DB_USER in .env (see .env.example)}
  DIGITALBANK_DB_PASSWORD: ${DIGITALBANK_DB_PASSWORD:?set DIGITALBANK_DB_PASSWORD in .env (see .env.example)}

  # The broker's in-network listener, not the localhost:9092 one for the host.
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  REDIS_HOST: redis
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

  AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:-https://dev-vkxlfm4oy207h5bq.us.auth0.com/}
  AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://mockbank/api}

  # Direct service-to-service URLs, for the Feign clients that use a fixed url
  # rather than Eureka. Each service reads only the ones it needs.
  ACCOUNT_SERVICE_URL: http://account-service:8084
  BILLER_SERVICE_URL: http://biller-service:8088
  PAYMENT_SERVICE_URL: http://payment-orchestrator:8086
  AUTH_USER_SERVICE_URL: http://auth-user:8094/

  # Heap sized from the container limit, serial GC and the C1 compiler only:
  # lower memory and faster startup, at some cost to peak throughput. The
  # right trade for eleven JVMs sharing a laptop. Override in .env.
  JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=64m}

x-java-service: &java-service
  restart: unless-stopped
  networks:
    - banking-network
  mem_limit: 448m

# Startup is slow with eleven JVMs competing for memory, so healthchecks allow
# a long start period before failures count.
x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 180s

# Application services start only after configuration, discovery and the core
# infrastructure are healthy.
x-app-depends: &app-depends
  config-server:
    condition: service_healthy
  service-registry:
    condition: service_healthy
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy
  redis:
    condition: service_healthy

services:

  # =========================================================================
  # Core infrastructure
  # =========================================================================

  postgres:
    image: postgres:16
    container_name: digitalbank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalbank
      POSTGRES_USER: ${DIGITALBANK_DB_USER:?set DIGITALBANK_DB_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${DIGITALBANK_DB_PASSWORD:?set DIGITALBANK_DB_PASSWORD in .env (see .env.example)}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the per-service databases. Runs only on an empty volume.
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d digitalbank"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2.6
    container_name: digitalbank-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: digitalbank-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xms64M -Xmx128M"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - banking-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: digitalbank-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Two listeners. A broker tells clients which address to reconnect to,
      # and the single localhost:9092 listener this used to have sent
      # containers to their own loopback. INTERNAL serves the services on the
      # network; EXTERNAL keeps localhost:9092 working for tools on the host.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_HEAP_OPTS: "-Xms128M -Xmx384M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # =========================================================================
  # Platform services: configuration and discovery come up first
  # =========================================================================

  config-server:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/Config-Server/Dockerfile
    image: digitalbank/config-server:local
    container_name: digitalbank-config-server
    ports:
      - "8888:8888"
    environment:
      # Mounted rather than baked in, so a config change needs a restart, not
      # a rebuild.
      CONFIG_REPO_LOCATION: file:/config-repo/
      EUREKA_URL: http://service-registry:8761/eureka/
      JAVA_TOOL_OPTIONS: ${SERVICE_JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k -XX:ReservedCodeCacheSize=64m}
    volumes:
      - ../Config-Server/config-repo:/config-repo:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]

  service-registry:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/Service-Registry/Dockerfile
    image: digitalbank/service-registry:local
    container_name: digitalbank-service-registry
    ports:
      - "8761:8761"
    environment:
      <<: *spring-env
    # Must wait for Config Server: its own application.yml sets no port, so
    # without configuration it would start on 8080 instead of 8761.
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]

  api-gateway:
    <<: *java-service
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: backend/API-Gateway/Dockerfile
    image: digitalbank/api-gateway:local
    container_name: digitalbank-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *spring-env
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]

  # =========================================================================
  # Domain services
  # =========================================================================

  auth-user:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/AuthUser-develop/Dockerfile
    image: digitalbank/auth-user:local
    container_name: digitalbank-auth-user
    ports:
      - "8094:8094"
    environment:
      <<: *spring-env
      # Management API credentials are optional: without them the service
      # starts and only /api/v1/iam/users fails, at call time.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_MGMT_CLIENT_ID: ${AUTH0_MGMT_CLIENT_ID:-}
      AUTH0_MGMT_CLIENT_SECRET: ${AUTH0_MGMT_CLIENT_SECRET:-}
      AUTH0_MGMT_AUDIENCE: ${AUTH0_MGMT_AUDIENCE:-}
      # No consent service exists in this platform; calls to it fail exactly
      # as they do outside Docker.
      CONSENT_SERVICE_URL: ${CONSENT_SERVICE_URL:-http://consent-service:8096/api/v1}
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8094/actuator/health || exit 1"]

  customer-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/CustomerService-develop/Dockerfile
    image: digitalbank/customer-service:local
    container_name: digitalbank-customer-service
    ports:
      - "8083:8083"
    environment:
      <<: *spring-env
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]

  account-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/AccountService-develop/Dockerfile
    image: digitalbank/account-service:local
    container_name: digitalbank-account-service
    ports:
      - "8084:8084"
    environment:
      <<: *spring-env
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]

  biller-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/BillerService-develop/Dockerfile
    image: digitalbank/biller-service:local
    container_name: digitalbank-biller-service
    ports:
      - "8088:8088"
    environment:
      <<: *spring-env
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health || exit 1"]

  payment-orchestrator:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/PaymentOrchestrator-develop/Dockerfile
    image: digitalbank/payment-orchestrator:local
    container_name: digitalbank-payment-orchestrator
    ports:
      - "8086:8086"
    environment:
      <<: *spring-env
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]

  billpay-worker-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/BillPayWorkerService-develop/Dockerfile
    image: digitalbank/billpay-worker-service:local
    container_name: digitalbank-billpay-worker-service
    ports:
      - "8090:8090"
    environment:
      <<: *spring-env
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health || exit 1"]

  settlement-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/SettlementService-develop/Dockerfile
    image: digitalbank/settlement-service:local
    container_name: digitalbank-settlement-service
    ports:
      - "8087:8087"
    environment:
      <<: *spring-env
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1"]

  ai-commerce-agent:
    <<: *java-service
    build:
      context: ../..
      dockerfile: backend/AICommerceAgent/Dockerfile
    image: digitalbank/ai-commerce-agent:local
    container_name: digitalbank-ai-commerce-agent
    ports:
      - "8095:8095"
    environment:
      <<: *spring-env
      # Read from the shell running compose. Compose refuses to start without
      # it rather than letting the agent crash-loop: the agent deliberately
      # refuses to start without a key. Outbound HTTPS to the Gemini API needs
      # no special networking; containers on a bridge network reach the
      # internet by default.
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY must be set in the shell or .env}
    depends_on: *app-depends
    healthcheck:
      <<: *healthcheck
      # Actuator health only. This must never call Gemini: the free tier allows
      # 20 requests a day, and a probe every 15 seconds would spend it in minutes.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8095/actuator/health || exit 1"]

  # =========================================================================
  # Observability (opt-in: docker compose --profile observability up)
  #
  # Off by default to leave memory for the services. With it off, services
  # still send trace spans to zipkin:9411 and log a connection warning; that is
  # harmless.
  # =========================================================================

  zipkin:
    image: openzipkin/zipkin:3.4.2
    container_name: digitalbank-zipkin
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9411:9411"
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: digitalbank-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - banking-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: digitalbank-grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - banking-network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  banking-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  prometheus_data:
  grafana_data:
