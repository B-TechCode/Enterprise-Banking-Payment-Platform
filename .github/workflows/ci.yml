name: CI

# Build and test verification only. Nothing here builds images, publishes
# artifacts or deploys: every run answers two questions, "does it compile?"
# and "do the tests pass?".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # opened, synchronize and reopened are the defaults. labeled is added so
    # that applying the run-integration label re-evaluates the workflow and
    # starts the integration job; without it, labelling a pull request starts
    # no run at all and the job below is simply never reconsidered.
    types: [opened, synchronize, reopened, labeled]

# A newer push to main cancels the run it supersedes. Pull request runs are
# deliberately left to finish.
#
# Cancelling them looks tidy and is not: opening a pull request and labelling it
# fire two events moments apart, so one of the two runs is cancelled, and which
# one survives is a race. When the cancelled one is the newer, branch protection
# tracks a cancelled check and the merge button never appears - which happened
# twice before this was changed, each time costing a re-run to clear. Letting
# both finish costs a few runner minutes on the double-trigger and nothing
# otherwise, since a single push to a branch still only starts one run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Read-only: this workflow publishes nothing and deploys nothing.
permissions:
  contents: read

# Both jobs pin ubuntu-24.04 rather than ubuntu-latest, which becomes Ubuntu
# 26.04 from 19 October 2026. Pinning makes that upgrade something we do on a
# day we choose, with a green run to compare against, instead of something that
# arrives inside an unrelated pull request as a mystery failure. The cost is
# that the pin has to be moved deliberately: 24.04 is supported for now, and
# GitHub announces image retirements well ahead.

jobs:
  build-and-test:
    name: Compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # cache: maven caches ~/.m2/repository, keyed on the hash of every
      # pom.xml, so dependencies are downloaded once rather than on every run.
      - name: Set up Java 21 with Maven dependency cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Its own step, so a build break reads as "Compile failed" rather than
      # being buried inside a test failure.
      - name: Compile (full reactor)
        run: mvn -B -ntp compile

      # -fae (fail at end) runs every module's tests even after one fails, so
      # one red module does not hide the state of the others.
      #
      # The excludes file lists tests that cannot pass on a bare runner, each
      # with its reason. Its path must be absolute: surefire resolves a relative
      # path against each module's directory, not the repository root.
      - name: Test
        id: test
        run: >
          mvn -B -ntp -fae test
          -Dsurefire.excludesFile=${{ github.workspace }}/.github/ci/surefire-excludes.txt

      # GEMINI_API_KEY is deliberately not referenced anywhere in this workflow,
      # so the live Gemini test must skip. This step proves it did, rather than
      # assuming it.
      - name: Verify the Gemini live test was skipped
        run: python3 .github/ci/verify-gemini-skip.py

      # Written to the run's summary page, and teed into the log so the same
      # table can be read from the command line (gh run view --log). Also
      # fails the job if a module's tests silently did not run.
      #
      # shell: bash is required, not cosmetic. It is what turns on pipefail.
      # GitHub's default shell does not use it, so the script's failing exit
      # status would be lost to tee's successful one and the guard would
      # never fail the job.
      - name: Test summary and execution guard
        if: always()
        shell: bash
        run: python3 .github/ci/test-summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      # The same totals as a run annotation. Job logs and summaries need a login
      # to read, even on a public repository; annotations do not, so a run's
      # real numbers can be confirmed through the API.
      - name: Publish test totals
        if: always()
        run: python3 .github/ci/test-summary.py --annotate

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # End-to-end tests: real Postgres, real Kafka, and five services running from
  # the jars this build produced. They take minutes rather than seconds, so they
  # do not run on every pull request.
  #
  #   - every push to main
  #   - any pull request labelled run-integration
  #
  # Run them locally with:  mvn -DskipTests install && mvn -pl backend/integration-tests verify
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    # Only worth starting if the code compiles and the unit tests pass.
    needs: build-and-test
    if: >-
      github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'run-integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java 21 with Maven dependency cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The tests start the services from these jars, so they must exist before
      # the tests run. Tests are skipped here; the job above already ran them.
      - name: Build the service jars
        run: mvn -B -ntp -DskipTests install

      - name: Run the integration tests
        run: mvn -B -ntp -pl backend/integration-tests verify

      - name: Publish integration results
        if: always()
        shell: bash
        run: python3 .github/ci/integration-summary.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload failsafe reports and container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: backend/integration-tests/target/failsafe-reports/
          retention-days: 7
